<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #ffffff;
      padding: 20px;
    }

    /* TOP BAR */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .btn-products {
      padding: 10px 30px;
      border-radius: 20px;
      border: 1px solid #aaa;
      background: #f3f3f3;
      font-size: 16px;
      cursor: pointer;
    }

    .filter-icon {
      font-size: 26px;
      cursor: pointer;
    }

    /* PRODUCT GRID */
    .product-grid {
      width: 100%;
      display: grid;
      /* columns auto adjust, no big empty area */
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      border: 1px solid #000;
    }

    .product-card {
      padding: 10px;
      border-right: 1px solid #000;
      border-bottom: 1px solid #000;
      text-align: center;
      font-size: 14px;
    }

    /* IMAGES: no cropping, full phone visible */
    .product-card img {
      width: 100%;
      height: 200px;
      object-fit: contain;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      background: #ffffff;
    }

    .product-name {
      font-weight: bold;
    }

    /* STAR RATING */
    .rating {
      margin-top: 4px;
      font-size: 16px;
      color: #f1c40f; /* golden stars */
    }

    /* OPTIONS BUTTON */
    .options-btn {
      margin-top: 25px;
      display: flex;
      justify-content: flex-end;
    }

    .btn-options {
      padding: 10px 25px;
      border-radius: 25px;
      background: #6842ff;
      color: white;
      border: none;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <button class="btn-products">PRODUCTS</button>
    <div class="filter-icon">&#128269;</div>
  </div>

  <!-- PRODUCT GRID -->
  <div class="product-grid">

    <!-- PRODUCT 1: Galaxy A36 -->
    <div class="product-card">
      <img src="A 36.png" alt="Galaxy A36">
      <div class="product-name">Galaxy A36</div>
      <div>75000</div>
      <div class="rating">★★★★☆</div>
    </div>

    <!-- PRODUCT 2: Galaxy A56 -->
    <div class="product-card">
      <img src="A 56.png" alt="Galaxy A56">
      <div class="product-name">Galaxy A56</div>
      <div>105000</div>
      <div class="rating">★★★★☆</div>
    </div>

    <!-- PRODUCT 3: Galaxy S24 Ultra -->
    <div class="product-card">
      <img src="s 24-ultra.png" alt="Galaxy S24 Ultra">
      <div class="product-name">Galaxy S24 Ultra</div>
      <div>350000</div>
      <div class="rating">★★★★☆</div>
    </div>

    <!-- PRODUCT 4: Galaxy S25 Ultra -->
    <div class="product-card">
      <img src="s25-ultra.png" alt="Galaxy S25 Ultra">
      <div class="product-name">Galaxy S25 Ultra</div>
      <div>550000</div>
      <div class="rating">★★★★☆</div>
    </div>

    <!-- PRODUCT 5: Galaxy Z Flip -->
    <div class="product-card">
      <img src="z flip.png" alt="Galaxy Z Flip">
      <div class="product-name">Galaxy Z Flip</div>
      <div>650000</div>
      <div class="rating">★★★★☆</div>
    </div>

    <!-- PRODUCT 6: Pixel 10 -->
    <div class="product-card">
      <img src="pixel 10.png" alt="Pixel 10">
      <div class="product-name">Pixel 10</div>
      <div>400000</div>
      <div class="rating">★★★★☆</div>
    </div>

    <!-- PRODUCT 7: OnePlus -->
    <div class="product-card">
      <img src="one plus.png" alt="OnePlus">
      <div class="product-name">OnePlus</div>
      <div>420000</div>
      <div class="rating">★★★★☆</div>
    </div>

  </div>

  <!-- OPTIONS BUTTON -->
  <div class="options-btn">
    <button class="btn-options">⚙ OPTIONS</button>
  </div>

</body>
</html>
