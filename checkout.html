<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Phone Checkout</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    .wrapper {
      max-width: 1050px;
      margin: 20px auto;
      background: #ffffff;
      padding: 20px;
      border: 1px solid #ddd;
    }

    /* TOP PRODUCT STRIP  ---------------------------------- */
    .product-strip {
      display: flex;
      gap: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #eee;
    }

    .product-card {
      width: 140px;
      font-size: 12px;
      text-align: left;
    }

    /* FIXED IMAGE CROPPING */
    .product-card img {
      height: 130px;      /* sab ki same height */
      width: auto;        /* width proportionally adjust */
      display: block;
      margin: 0 auto;     /* center image inside card */
      border-radius: 6px;
      border: 1px solid #ddd;
    }

    .product-name {
      font-weight: bold;
      display: block;
      margin-top: 8px;
    }

    .product-price {
      display: block;
      margin-top: 2px;
    }

    .product-rate {
      display: block;
      margin-top: 2px;
    }

    .add-row {
      display: flex;
      align-items: center;
      margin-top: 8px;
      gap: 6px;
    }

    .plus-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    .add-text {
      font-weight: bold;
      font-size: 12px;
    }

    /* BOTTOM SECTION (SUMMARY + PAYMENT) ------------------ */
    .bottom-section {
      display: flex;
      gap: 25px;
      margin-top: 25px;
    }

    /* LEFT SUMMARY CARD */
    .summary-card {
      flex: 1;
      background: #fef5f5;
      border-radius: 10px;
      border: 1px solid #eee;
      padding: 30px 25px;
    }

    .summary-title {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .summary-price-row {
      text-align: center;
      margin-bottom: 25px;
      font-size: 18px;
    }

    .summary-price-row .price-big {
      font-size: 26px;
      font-weight: bold;
    }

    .summary-price-row .currency {
      font-size: 13px;
      margin-left: 5px;
    }

    .summary-list {
      list-style-type: disc;
      margin-left: 25px;
      font-size: 14px;
    }

    .summary-list li {
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      max-width: 220px;
    }

    .summary-list span.value {
      margin-left: 40px;
    }

    .btn-buy {
      margin-top: 30px;
      width: 100%;
      padding: 12px 0;
      border-radius: 25px;
      border: none;
      background: #f8a6a6;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    /* RIGHT PAYMENT CARD */
    .payment-card {
      flex: 1;
      padding: 10px;
    }

    .fav-btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid #ddd;
      background: #ffffff;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .fav-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .btn-payment-method {
      width: 100%;
      padding: 12px 0;
      background: #a9e5b4;
      border-radius: 8px;
      border: 1px solid #6acb80;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .card-input-row {
      display: flex;
      align-items: center;
      margin-bottom: 25px;
    }

    .card-icon {
      width: 32px;
      height: 24px;
      border-radius: 4px;
      border: 3px solid #000;
      margin-right: 10px;
    }

    .card-input {
      flex: 1;
    }

    .card-input input {
      width: 100%;
      padding: 8px;
      border: none;
      border-bottom: 6px solid #d3d3d3;
      font-size: 14px;
    }

    .card-input input:focus {
      outline: none;
      border-bottom-color: #999;
    }

    .btn-continue {
      width: 100%;
      padding: 12px 0;
      background: #f7c968;
      border-radius: 8px;
      border: 1px solid #e4b23a;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .save-row {
      display: flex;
      flex-direction: column;
      font-size: 13px;
      gap: 3px;
    }

    .save-main {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .save-main input {
      width: 16px;
      height: 16px;
    }

    .save-later {
      margin-left: 24px;
      color: #888;
    }

    .bottom-right-icon {
      text-align: right;
      margin-top: 25px;
      font-size: 24px;
    }
  </style>
</head>
<body>

<div class="wrapper">

  <!-- TOP PRODUCT STRIP -->
  <div class="product-strip">
    <!-- Product 1: Galaxy A36 -->
    <div class="product-card">
      <img src="A 36.png" alt="Galaxy A36">
      <span class="product-name">Galaxy A36</span>
      <span class="product-price">75000</span>
      <span class="product-rate">Rate 4.1</span>
      <div class="add-row">
        <div class="plus-circle">+</div>
        <span class="add-text">ADD</span>
      </div>
    </div>

    <!-- Product 2: Galaxy A56 -->
    <div class="product-card">
      <img src="A 56.png" alt="Galaxy A56">
      <span class="product-name">Galaxy A56</span>
      <span class="product-price">105000</span>
      <span class="product-rate">Rate 4.2</span>
      <div class="add-row">
        <div class="plus-circle">+</div>
        <span class="add-text">ADD</span>
      </div>
    </div>

    <!-- Product 3: Galaxy S24 Ultra -->
    <div class="product-card">
      <img src="s 24-ultra.png" alt="Galaxy S24 Ultra">
      <span class="product-name">Galaxy S24 Ultra</span>
      <span class="product-price">350000</span>
      <span class="product-rate">Rate 4.7</span>
      <div class="add-row">
        <div class="plus-circle">+</div>
        <span class="add-text">ADD</span>
      </div>
    </div>

    <!-- Product 4: Galaxy S25 Ultra -->
    <div class="product-card">
      <img src="s25-ultra.png" alt="Galaxy S25 Ultra">
      <span class="product-name">Galaxy S25 Ultra</span>
      <span class="product-price">550000</span>
      <span class="product-rate">Rate 4.8</span>
      <div class="add-row">
        <div class="plus-circle">+</div>
        <span class="add-text">ADD</span>
      </div>
    </div>
  </div>

  <!-- BOTTOM SECTION -->
  <div class="bottom-section">
    <!-- LEFT: SUMMARY CARD -->
    <div class="summary-card">
      <div class="summary-title">SAM A36</div>

      <div class="summary-price-row">
        <span class="price-big">71000</span>
        <span class="currency">pkr</span>
      </div>

      <ul class="summary-list">
        <li>
          <span>Market Price</span>
          <span class="value">84999</span>
        </li>
        <li>
          <span>Sale Price</span>
          <span class="value">71000</span>
        </li>
        <li>
          <span>Delivery Charges</span>
          <span class="value">299</span>
        </li>
        <li>
          <span>Sub Total</span>
          <span class="value">71299</span>
        </li>
      </ul>

      <button class="btn-buy">BUY</button>
    </div>

    <!-- RIGHT: PAYMENT SECTION -->
    <div class="payment-card">
      <button class="fav-btn">
        <span class="fav-icon">+</span>
        <span>Add Favourite</span>
      </button>

      <button class="btn-payment-method">PAYMENT METHOD</button>

      <div class="card-input-row">
        <div class="card-icon"></div>
        <div class="card-input">
          <input type="text" placeholder="Enter Credit Card No">
        </div>
      </div>

      <button class="btn-continue">CONTINUE SHOPPING</button>

      <div class="save-row">
        <div class="save-main">
          <input type="checkbox" id="save">
          <label for="save">Save</label>
        </div>
        <span class="save-later">For Later</span>
      </div>

      <div class="bottom-right-icon">
        ⤴
      </div>
    </div>
  </div>
</div>

</body>
</html>
