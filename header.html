<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #ffffff;
      padding: 20px;
    }

    /* TOP BAR */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .btn-products {
      padding: 10px 30px;
      border-radius: 20px;
      border: 1px solid #aaa;
      background: #f3f3f3;
      font-size: 16px;
      cursor: pointer;
    }

    .filter-icon {
      font-size: 26px;
      cursor: pointer;
    }

    /* PRODUCT GRID */
    .product-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      border: 1px solid #000;
    }

    .product-card {
      padding: 10px;
      border-right: 1px solid #000;
      border-bottom: 1px solid #000;
      text-align: center;
      font-size: 14px;
    }

    .product-card img {
      width: 120px;
      height: 150px;
      object-fit: cover;
      margin-bottom: 10px;
      border: 1px solid #ddd;
    }

    .product-name {
      font-weight: bold;
    }

    /* OPTIONS BUTTON */
    .options-btn {
      margin-top: 25px;
      display: flex;
      justify-content: flex-end;
    }

    .btn-options {
      padding: 10px 25px;
      border-radius: 25px;
      background: #6842ff;
      color: white;
      border: none;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    @media(max-width: 900px){
      .product-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media(max-width: 600px){
      .product-grid { grid-template-columns: repeat(1, 1fr); }
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <button class="btn-products">PRODUCTS</button>
    <div class="filter-icon">&#128269;</div>
  </div>

  <!-- PRODUCT GRID -->
  <div class="product-grid">

    <!-- PRODUCT 1 -->
    <div class="product-card">
      <img src="https://via.placeholder.com/150x180?text=Galaxy+Z+Fold" alt="phone">
      <div class="product-name">Galaxy Z Fold</div>
      <div>600000</div>
      <div>Rate 4.5</div>
    </div>

    <!-- PRODUCT 2 -->
    <div class="product-card">
      <img src="https://via.placeholder.com/150x180?text=Galaxy+S25E" alt="phone">
      <div class="product-name">Galaxy S 25E</div>
      <div>450000</div>
      <div>Rate 4.3</div>
    </div>

    <!-- PRODUCT 3 -->
    <div class="product-card">
      <img src="https://via.placeholder.com/150x180?text=Galaxy+A36" alt="phone">
      <div class="product-name">Galaxy A36</div>
      <div>75000</div>
      <div>Rate 4.1</div>
    </div>

    <!-- PRODUCT 4 -->
    <div class="product-card">
      <img src="https://via.placeholder.com/150x180?text=Galaxy+A56" alt="phone">
      <div class="product-name">Galaxy A56</div>
      <div>105000</div>
      <div>Rate 4.2</div>
    </div>

    <!-- PRODUCT 5 -->
    <div class="product-card">
      <img src="https://via.placeholder.com/150x180?text=Galaxy+Flip" alt="phone">
      <div class="product-name">Galaxy Z FLIP</div>
      <div>650000</div>
      <div>Rate 4.7</div>
    </div>

    <!-- PRODUCT 6 -->
    <div class="product-card">
      <img src="https://via.placeholder.com/150x180?text=Galaxy+S25+Ultra" alt="phone">
      <div class="product-name">Galaxy S25 Ultra</div>
      <div>550000</div>
      <div>Rate 4.8</div>
    </div>

    <!-- PRODUCT 7 -->
    <div class="product-card">
      <img src="https://via.placeholder.com/150x180?text=Galaxy+S24+Ultra" alt="phone">
      <div class="product-name">Galaxy S24 Ultra</div>
      <div>350000</div>
      <div>Rate 4.7</div>
    </div>

    <!-- PRODUCT 8 -->
    <div class="product-card">
      <img src="https://via.placeholder.com/150x180?text=Galaxy+S25" alt="phone">
      <div class="product-name">Galaxy S 25</div>
      <div>450000</div>
      <div>Rate 4.8</div>
    </div>

  </div>

  <!-- OPTIONS BUTTON -->
  <div class="options-btn">
    <button class="btn-options">⚙ OPTIONS</button>
  </div>

</body>
</html>
